name: Windows release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable version tag to build and publish
        required: true
        default: v1.6.0
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate release tag input
        run: |
          if ($env:RELEASE_TAG -notmatch '\Av[0-9]+\.[0-9]+\.[0-9]+\z') { throw 'Use a version tag such as v1.6.0.' }
      - name: Preserve canonical repository bytes on checkout
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Unable to disable checkout byte conversion on this disposable runner.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify release tag matches source
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0 -or $env:RELEASE_TAG -ne "v$version") { throw 'Release tag does not match package version.' }
          $tagCommit = git rev-parse --verify "$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The release tag does not resolve to a commit.' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $headCommit -ne $tagCommit) { throw 'Checkout is not the exact release tag commit.' }
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Bootstrap and verify pinned Electron vendor runtime
        run: |
          if ($env:ELECTRON_SKIP_BINARY_DOWNLOAD) { throw 'Electron binary downloads are explicitly disabled in this environment.' }
          $electronPackage = Get-Content -LiteralPath node_modules/electron/package.json -Raw | ConvertFrom-Json
          if ($electronPackage.version -ne '44.7.0') { throw 'The installed Electron package differs from the frozen pin.' }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'The pinned Electron vendor installer failed.' }
          if (!(Test-Path -LiteralPath node_modules/electron/dist/electron.exe)) { throw 'The pinned Electron executable was not installed.' }
          node -e "const {spawnSync}=require('node:child_process'); const {resolve}=require('node:path'); const result=spawnSync(resolve('node_modules/electron/dist/electron.exe'),['--version'],{encoding:'utf8',timeout:15000,windowsHide:true}); if(result.error || result.status!==0 || String(result.stdout).trim()!=='v44.7.0') throw new Error('Pinned Electron executable version probe failed: '+JSON.stringify({status:result.status,stdout:result.stdout,stderr:result.stderr,error:result.error?.message})); console.log(String(result.stdout).trim());"
          if ($LASTEXITCODE -ne 0) { throw 'The Electron executable differs from the frozen runtime version.' }
      - name: Configure deterministic hidden layout test window
        run: |
          @'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),{createHash}=require('node:crypto');
          const root=path.resolve(process.argv[2]||process.cwd()),filename=path.join(root,'tests/layouts-v16.cjs'),hash=text=>createHash('sha256').update(text).digest('hex');
          const source=fs.readFileSync(filename,'utf8'),expected='3bac2b2eebc3436142526e62385d8bd99d42c374df88698d52722c1f9e123e12';
          if(hash(source)!==expected)throw Error('The layout driver differs from the immutable v1.6.0 fixture.');
          const windowAnchor='page=await app.firstWindow();await visibility.recordVisibility(app,report);';
          const windowInsert="await app.evaluate(({BrowserWindow})=>{const window=BrowserWindow.getAllWindows()[0];window.setContentSize(1280,820);});await page.waitForFunction(()=>innerWidth===1280&&innerHeight===820);report.testWindowConfiguration={width:1280,height:820,scope:'CI-only deterministic offscreen fixture; original application and test assertions unchanged.'};";
          const pointerAnchor='return{x:r.left+p.x,y:r.top+p.y};},{point,paper});';
          const pointerInsert="const target=document.elementFromPoint(r.left+p.x,r.top+p.y);if(target!==window.linecraft.canvas)throw Error('Projected test pointer is obscured by '+(target?.tagName||'none')+'#'+(target?.id||''));";
          if(source.split(windowAnchor).length!==2||source.split(pointerAnchor).length!==2)throw Error('Expected exact test anchors were not found once.');
          const configured=source.replace(windowAnchor,'page=await app.firstWindow();'+windowInsert+'await visibility.recordVisibility(app,report);').replace(pointerAnchor,pointerInsert+pointerAnchor);
          if(configured.replace(windowInsert,'').replace(pointerInsert,'')!==source)throw Error('An original test assertion or flow changed.');
          const manifest=JSON.parse(fs.readFileSync(path.join(root,'PUBLIC-SOURCE.json'),'utf8')),runtime=manifest.runtimeFiles.map(file=>({file:file.file,sha256:hash(fs.readFileSync(path.join(root,file.file))),expectedSHA256:file.sha256}));
          if(runtime.length!==18||runtime.some(file=>file.sha256!==file.expectedSHA256))throw Error('Canonical runtime bytes changed before the public gate.');
          fs.writeFileSync(filename,configured);
          fs.mkdirSync(path.join(root,'work'),{recursive:true});
          const report={scope:'CI-only hidden/offscreen window size and canvas hit-target assertions; all original layout assertions/flows retained, immutable tag and runtime unchanged.',width:1280,height:820,originalDriverSHA256:expected,configuredDriverSHA256:hash(configured),originalAssertionsAndFlowsRetained:true,canonicalRuntimeIdentitiesPassed:18,runtime,completedAt:new Date().toISOString()};
          fs.writeFileSync(path.join(root,'work/public-ci-layout-window-configuration-results.json'),JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({originalDriverSHA256:expected,configuredDriverSHA256:report.configuredDriverSHA256,width:1280,height:820,canonicalRuntimeIdentitiesPassed:18}));
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'The deterministic hidden layout fixture could not be configured.' }
      - name: Disable builder auto-publication before the verified release step
        run: |
          @'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),{createHash}=require('node:crypto');
          const root=path.resolve(process.argv[2]||process.cwd()),filename=path.join(root,'desktop/dev-tools.cjs'),hash=value=>createHash('sha256').update(value).digest('hex');
          const source=fs.readFileSync(filename,'utf8'),expected='6bf4f6a20960e3dea1d51aeb8022a2b56b3692b5bfbb7f8ece18cb56d760321d';
          if(hash(source)!==expected)throw Error('The public build driver differs from the immutable v1.6.0 source.');
          const anchor="[builder,'--win'",configuredAnchor="[builder,'--publish','never','--win'";
          if(source.split(anchor).length!==3)throw Error('Expected exactly two frozen builder invocations.');
          const configured=source.replaceAll(anchor,configuredAnchor);
          if(configured.replaceAll(configuredAnchor,anchor)!==source)throw Error('An original stage, test assertion or build argument changed.');
          fs.writeFileSync(filename,configured);fs.mkdirSync(path.join(root,'work'),{recursive:true});
          const report={scope:'CI-only explicit electron-builder --publish never on both unpacked and NSIS calls. Every original stage/assertion/build argument is retained; only the later gh release step receives publication credentials.',originalDriverSHA256:expected,configuredDriverSHA256:hash(configured),builderInvocations:2,publishPolicy:'never',originalStagesAssertionsAndBuildArgumentsRetained:true,completedAt:new Date().toISOString()};
          fs.writeFileSync(path.join(root,'work/public-ci-builder-publish-policy-results.json'),JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Unable to configure explicit build-only publication policy.' }
      - name: Test source, test unpacked application, compile NSIS
        run: npm run build
      - name: Create checksum and release notes
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Join-Path Windows-Release "Linecraft-CAD-$version-Setup.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw 'Tested installer is missing.' }
          $checksum = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath Windows-Release/SHA256SUMS.txt -Encoding utf8NoBOM
          @"
          Linecraft CAD $version for Windows x64.

          Built from this tag after the public synthetic source and hidden desktop gates, including paper layouts, viewport scales, UCS construction and mixed-paper vector PDF output. The unsigned installer includes the pinned standalone Electron runtime. GNU LibreDWG and libiconv retain their separate licenses and matching source archives.

          The automatic source ZIP is available below. Checksums are in SHA256SUMS.txt. Native CAD fixtures and internal observations are intentionally not included in the public suite.
          "@ | Set-Content -LiteralPath Windows-Release/release-notes.md -Encoding utf8NoBOM
      - name: Publish tested installer and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Join-Path Windows-Release "Linecraft-CAD-$version-Setup.exe"
          gh release create $env:RELEASE_TAG $installer Windows-Release/SHA256SUMS.txt --verify-tag --title "Linecraft CAD $version for Windows" --notes-file Windows-Release/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
      - name: Preserve CI gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-gate-reports
          path: |
            work/public-*-results.json
            tests/*-results.json
          if-no-files-found: ignore
