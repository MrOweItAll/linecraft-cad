name: Windows release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable version tag to build and publish
        required: true
        default: v1.14.0
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate release tag input
        run: |
          if ($env:RELEASE_TAG -notmatch '\Av[0-9]+\.[0-9]+\.[0-9]+\z') { throw 'Use a version tag such as v1.14.0.' }
      - name: Preserve canonical repository bytes on checkout
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Unable to disable checkout byte conversion on this disposable runner.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify release tag matches source
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0 -or $env:RELEASE_TAG -ne "v$version") { throw 'Release tag does not match package version.' }
          $tagCommit = git rev-parse --verify "$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The release tag does not resolve to a commit.' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $headCommit -ne $tagCommit) { throw 'Checkout is not the exact release tag commit.' }
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Bootstrap and verify pinned Electron vendor runtime
        run: |
          if ($env:ELECTRON_SKIP_BINARY_DOWNLOAD) { throw 'Electron binary downloads are explicitly disabled in this environment.' }
          $electronPackage = Get-Content -LiteralPath node_modules/electron/package.json -Raw | ConvertFrom-Json
          if ($electronPackage.version -ne '44.7.0') { throw 'The installed Electron package differs from the frozen pin.' }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'The pinned Electron vendor installer failed.' }
          if (!(Test-Path -LiteralPath node_modules/electron/dist/electron.exe)) { throw 'The pinned Electron executable was not installed.' }
          node -e "const {spawnSync}=require('node:child_process'); const {resolve}=require('node:path'); const result=spawnSync(resolve('node_modules/electron/dist/electron.exe'),['--version'],{encoding:'utf8',timeout:15000,windowsHide:true}); if(result.error || result.status!==0 || String(result.stdout).trim()!=='v44.7.0') throw new Error('Pinned Electron executable version probe failed: '+JSON.stringify({status:result.status,stdout:result.stdout,stderr:result.stderr,error:result.error?.message})); console.log(String(result.stdout).trim());"
          if ($LASTEXITCODE -ne 0) { throw 'The Electron executable differs from the frozen runtime version.' }
      - name: Verify canonical runtime and explicit build-only policy
        run: |
          @'
          'use strict';
          const fs=require('node:fs'),{createHash}=require('node:crypto');
          const manifest=JSON.parse(fs.readFileSync('PUBLIC-SOURCE.json','utf8'));
          if(manifest.version!==require('./package.json').version||manifest.runtimeFiles.length!==37)throw Error('Public runtime manifest does not match this release.');
          for(const file of manifest.runtimeFiles){const actual=createHash('sha256').update(fs.readFileSync(file.file)).digest('hex');if(actual!==file.sha256)throw Error('Canonical runtime bytes changed: '+file.file);}
          const driver=fs.readFileSync('desktop/dev-tools.cjs','utf8');
          if((driver.match(/\[builder,'--publish','never','--win'/g)||[]).length!==2)throw Error('Both builder stages must explicitly disable automatic publication.');
          for(const file of ['tests/layouts-v16.cjs','tests/viewports-v17.cjs','tests/viewport-regression-v17.cjs','tests/viewport-scales-v18.cjs']){const source=fs.readFileSync(file,'utf8');if(!source.includes('setContentSize(1280,820)'))throw Error('A hidden UI fixture lacks its deterministic content size: '+file);}
          if(!fs.readFileSync('tests/architecture-desktop.cjs','utf8').includes('setContentSize(1280,850)'))throw Error('Architecture hidden fixture lacks its deterministic content size.');
          if(!fs.readFileSync('tests/clearance-desktop.cjs','utf8').includes('setContentSize(1280,900)'))throw Error('Clearance hidden fixture lacks its deterministic content size.');
          if(!fs.readFileSync('tests/tray-desktop.cjs','utf8').includes('setContentSize(1280,900)'))throw Error('Tray hidden fixture lacks its deterministic content size.');
          if(!fs.readFileSync('tests/gable-desktop.cjs','utf8').includes('setContentSize(1280,900)'))throw Error('Gable hidden fixture lacks its deterministic content size.');
          if(!fs.readFileSync('tests/scripting-desktop.cjs','utf8').includes('setContentSize(1280,900)'))throw Error('Scripting hidden fixture lacks its deterministic content size.');
          if(!fs.readFileSync('tests/bearing-desktop.cjs','utf8').includes('setContentSize(1280,900)'))throw Error('Bearing hidden fixture lacks its deterministic content size.');
          if(!fs.readFileSync('tests/alternatives-desktop.cjs','utf8').includes('setContentSize(1280,900)'))throw Error('R6 hidden fixture lacks its deterministic content size.');
          console.log('Canonical runtime identities: 37/37; build-only policy and deterministic hidden fixtures verified.');
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Canonical runtime or build fixture policy verification failed.' }
      - name: Test source, test unpacked application, compile NSIS
        run: npm run build
      - name: Create checksum and release notes
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Join-Path Windows-Release "Linecraft-CAD-$version-Setup.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw 'Tested installer is missing.' }
          $checksum = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath Windows-Release/SHA256SUMS.txt -Encoding utf8NoBOM
          @"
          Linecraft CAD $version for Windows x64.

          Built from this tag after the public synthetic source and hidden desktop gates, including editable rectangular and simple closed polygon viewports, cursor-anchored model navigation, physical architectural/engineering/ratio presets, exact custom scales, protected scale controls, UCS construction and vector PDF clipping. The unsigned installer includes the pinned standalone Electron runtime. GNU LibreDWG and libiconv retain their separate licenses and matching source archives.

          Roof + Space R0–R6 adds semantic walls/rooms, generated equal-eave hip roofs, flat-ceiling analysis and one bounded rectangular stepped tray beneath a fixed roof. Exact declared cells and reservations bound volume, headroom and closed return interfaces; dimensioned section snapshots follow the actual accepted profile and exclude unaccepted proposals. Ceiling and bearing elevations remain separate, and ceiling edits do not alter exterior roof geometry. Both requested truss surcharges remain zero. Roofs, ceilings and tray returns use an explicit zero-thickness mathematical surface model by default; return material volume is zero and return area is retained. Optional physical offsets and reservation boxes remain supported. Existing entered offsets are preserved until an explicit grouped zero-thickness action. Physical framing and structural verification are separate from mathematical feasibility. Confirmed terminal gable assignments generate equal-bearing gable skins with separate eave/rake overhangs and zero-thickness closure surfaces. Candidate alternatives require explicit confirmation; mixed outer hip caps are not substituted. Sloping and closure areas are reported separately, and only sloping faces bound ceiling space. Schema 6 explicitly migrates schemas 1–5; all seven archived architectural examples remain unchanged. Bounded equal-pitch unequal-bearing fronts use explicit geometric-edge heights, confirmed drafts, same support normalization as Apply, source support/coverage/runoff checks and separate zero-thickness step interfaces. The 20-foot 4:12 analytical case raises one bearing from 10 to 12 feet, moving the ridge 3 feet toward it, to elevation 14 feet 4 inches. Conflicting walls, consumed supports and unsupported transitions fail atomically. Physical framing, variable pitch, arbitrary composed steps, vaulted ceilings remain outside verified scope.

          R6 compares a bounded stated grid of flat/tray ceilings beneath a fixed roof, with explicit optional permitted-pitch and uniform-bearing co-design. Target-capped benefit, raw usable volume, physical roof/closure/return/gross boundary quantities and declared nominal materials stay separate. Progress/cancel and work/time/configuration limits prevent incomplete recommendations. A reviewed feasible row is regenerated before one grouped Apply; source-only schema 6 stores its accepted ID. Static ordinary paper-text reports and actual PDF tests retain partial material confidence, unverified framing, zero surcharges and no global/cost optimum claim.

          Opt-in structured scripting uses copied object IDs and session/drawing tokens, private staging, one grouped Undo record and authenticated ephemeral loopback control. Ordinary launches keep local control disabled; supplied JavaScript, shell and arbitrary file operations are not exposed. Source and unpacked gates include real CLI edits, native Save/Open and vector PDF output while retaining current R4 architecture.

          Generated roof skins and separate gable closures are regenerated from validated native source before vector plotting. Source and unpacked acceptance include analytical A3 plan/elevation sheets at locked physical 1:96/1:48 scales and a frozen-layer negative sheet. Layer visibility, color, weight and clipping retain the established plot path. Pending/infeasible roofs issue warnings; 3D PDF remains wireframe without shaded faces or hidden-line removal. Native files retain authoritative source, distinct ceiling/bearing elevations and the zero-thickness mathematical model.

          Viewport frame resize retains its physical model scale; MOVE translates the window and content. DWG input remains bounded model-space import; DWG writing, full native drawing fidelity and ACIS solids are unsupported.

          The automatic source ZIP is available below. Checksums are in SHA256SUMS.txt. Native CAD fixtures and internal observations are intentionally not included in the public suite.
          "@ | Set-Content -LiteralPath Windows-Release/release-notes.md -Encoding utf8NoBOM
      - name: Publish tested installer and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Join-Path Windows-Release "Linecraft-CAD-$version-Setup.exe"
          gh release create $env:RELEASE_TAG $installer Windows-Release/SHA256SUMS.txt --verify-tag --title "Linecraft CAD $version for Windows" --notes-file Windows-Release/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
      - name: Preserve CI gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-gate-reports
          path: |
            work/public-*-results.json
            tests/*-results.json
          if-no-files-found: ignore
